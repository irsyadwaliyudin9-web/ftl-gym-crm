<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8533"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Orange Accent Border -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#orangeGrad)" stroke-width="16"/>
  
  <!-- Inner Glow Ring -->
  <rect x="26" y="26" width="460" height="460" rx="88" fill="none" stroke="#FF6B00" stroke-opacity="0.25" stroke-width="4"/>
  
  <!-- Big 101 Monogram -->
  <text x="256" y="275" font-family="system-ui, -apple-system, Montserrat, Arial, sans-serif" font-weight="900" font-size="190" fill="url(#orangeGrad)" text-anchor="middle" letter-spacing="-4">101</text>
  
  <!-- Gym Brand Subtitle -->
  <text x="256" y="355" font-family="system-ui, -apple-system, Montserrat, Arial, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">ONE O ONE GYM</text>
  
  <!-- Garut Kota Tag -->
  <rect x="156" y="388" width="200" height="34" rx="17" fill="#222222" stroke="#FF6B00" stroke-width="2"/>
  <text x="256" y="411" font-family="system-ui, -apple-system, Arial, sans-serif" font-weight="800" font-size="16" fill="#FF8533" text-anchor="middle" letter-spacing="3">GARUT KOTA</text>
  
  <!-- Small Center Dot -->
  <circle cx="256" cy="452" r="6" fill="#FF6B00"/>
</svg>